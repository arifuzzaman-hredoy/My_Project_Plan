name: Deploy My Plan Project

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-my-plan-project
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  APP_DIR: "/var/www/my-plan-project/current"
  SHARED_DIR: "/var/www/my-plan-project/shared"
  APP_PORT: "4010"
  NEXT_PUBLIC_APP_URL: "https://mynextplan.tradepulsx.com"

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MYPLAN_UPLOAD_DIR: storage/uploads
          MAX_UPLOAD_MB: "200"
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm run build

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Create production env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          {
            printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"
            printf 'ADMIN_USERNAME="%s"\n' "$ADMIN_USERNAME"
            printf 'ADMIN_PASSWORD="%s"\n' "$ADMIN_PASSWORD"
            printf 'AUTH_SECRET="%s"\n' "$AUTH_SECRET"
            printf 'MYPLAN_UPLOAD_DIR="storage/uploads"\n'
            printf 'MAX_UPLOAD_MB="200"\n'
            printf 'NEXT_PUBLIC_APP_URL="%s"\n' "$NEXT_PUBLIC_APP_URL"
            printf 'DEEPSEEK_API_KEY="%s"\n' "$DEEPSEEK_API_KEY"
            printf 'DEEPSEEK_MODEL="deepseek-chat"\n'
            printf 'DEEPSEEK_BASE_URL="https://api.deepseek.com"\n'
            printf 'NEXT_TELEMETRY_DISABLED="1"\n'
          } > .env.production

      - name: Prepare VPS folders
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            mkdir -p '$APP_DIR'
            mkdir -p '$SHARED_DIR/logs'
            mkdir -p '$SHARED_DIR/storage/uploads'
          "

      - name: Upload project files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".next" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.production" \
            --exclude "storage/uploads" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Upload production env to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            .env.production "$VPS_USER@$VPS_HOST:$SHARED_DIR/.env.production"

      - name: Install, build, init DB, and restart PM2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            set -e

            cd '$APP_DIR'

            cp '$SHARED_DIR/.env.production' .env.production
            cp '$SHARED_DIR/.env.production' .env.local

            mkdir -p storage/uploads
            npm ci
            npm run db:init
            rm -rf .next
            npm run build

            pm2 delete my-plan-project || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save
          "

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            sleep 5
            curl -I http://127.0.0.1:$APP_PORT
            pm2 status
          "