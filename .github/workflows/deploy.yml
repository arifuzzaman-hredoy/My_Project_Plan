name: Deploy My Plan Project

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-my-plan-project
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  APP_DIR: "/var/www/my-plan-project/current"
  SHARED_DIR: "/var/www/my-plan-project/shared"
  APP_PORT: "4010"
  NEXT_PUBLIC_APP_URL: "https://mynextplan.tradepulsx.com"

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MYPLAN_UPLOAD_DIR: storage/uploads
          MAX_UPLOAD_MB: "200"
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          AUTOMATION_ENABLED: "true"
          AUTOMATION_POLL_SECONDS: "60"
          AUTOMATION_APP_HEALTH_URL: http://127.0.0.1:4010/login
          TIMEZONE: Asia/Dhaka
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_DRIVE_ENABLED: "false"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm run build

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Create production env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          {
            printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"
            printf 'ADMIN_USERNAME="%s"\n' "$ADMIN_USERNAME"
            printf 'ADMIN_PASSWORD="%s"\n' "$ADMIN_PASSWORD"
            printf 'AUTH_SECRET="%s"\n' "$AUTH_SECRET"

            printf 'MYPLAN_UPLOAD_DIR="storage/uploads"\n'
            printf 'MAX_UPLOAD_MB="200"\n'
            printf 'NEXT_PUBLIC_APP_URL="%s"\n' "$NEXT_PUBLIC_APP_URL"

            printf 'DEEPSEEK_API_KEY="%s"\n' "$DEEPSEEK_API_KEY"
            printf 'DEEPSEEK_MODEL="deepseek-chat"\n'
            printf 'DEEPSEEK_BASE_URL="https://api.deepseek.com"\n'

            printf 'AUTOMATION_ENABLED="true"\n'
            printf 'AUTOMATION_POLL_SECONDS="60"\n'
            printf 'AUTOMATION_APP_HEALTH_URL="http://127.0.0.1:4010/login"\n'
            printf 'TIMEZONE="Asia/Dhaka"\n'

            printf 'TELEGRAM_BOT_TOKEN="%s"\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID="%s"\n' "$TELEGRAM_CHAT_ID"

            printf 'EMAIL_HOST="%s"\n' "$EMAIL_HOST"
            printf 'EMAIL_PORT="%s"\n' "$EMAIL_PORT"
            printf 'EMAIL_USER="%s"\n' "$EMAIL_USER"
            printf 'EMAIL_PASS="%s"\n' "$EMAIL_PASS"
            printf 'EMAIL_TO="%s"\n' "$EMAIL_TO"

            printf 'GOOGLE_DRIVE_ENABLED="false"\n'
            printf 'NEXT_TELEMETRY_DISABLED="1"\n'
          } > .env.production

      - name: Prepare VPS folders
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            mkdir -p '$APP_DIR'
            mkdir -p '$SHARED_DIR/logs'
            mkdir -p '$SHARED_DIR/storage/uploads'
          "

      - name: Upload project files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".next" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.production" \
            --exclude ".venv-automation" \
            --exclude "storage/uploads" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Upload production env to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            .env.production "$VPS_USER@$VPS_HOST:$SHARED_DIR/.env.production"

      - name: Install, build, init DB, setup Python worker, and restart PM2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            set -e

            export DEBIAN_FRONTEND=noninteractive

            cd '$APP_DIR'

            cp '$SHARED_DIR/.env.production' .env.production
            cp '$SHARED_DIR/.env.production' .env.local

            apt-get update
            apt-get install -y python3 python3-pip python3-full python3.12-venv

            mkdir -p storage/uploads
            mkdir -p '$SHARED_DIR/logs'
            mkdir -p '$SHARED_DIR/storage/uploads'

            npm install
            npm run db:init

            rm -rf .next
            npm run build

            rm -rf .venv-automation
            python3 -m venv .venv-automation
            . .venv-automation/bin/activate
            pip install --upgrade pip
            pip install -r automation/requirements.txt
            deactivate

            pm2 delete my-plan-project || true
            pm2 delete my-plan-automation || true

            pm2 start ecosystem.config.cjs --update-env
            pm2 save
          "

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            sleep 8
            curl -I http://127.0.0.1:$APP_PORT
            pm2 status
          "